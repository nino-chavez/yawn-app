[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/session-core",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
# Already in the tree transitively; declared here so the one place that needs
# it — decoding the worker's vector replies — uses the same version rather
# than adding a second.
base64 = "0.22"
core-foundation = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
# `asm` selects sha2 0.10's Apple Silicon SHA-256 instructions. Without it
# every artifact hash runs the software compressor: 168 ms against 35 ms for
# a 71 MB recording on an M3 Max. On aarch64 the feature also builds sha2-asm,
# which nothing links. sha2 0.11 uses the hardware path by default.
sha2 = { version = "0.10", features = ["asm"] }
sysinfo = "0.37"
tempfile = "3"
thiserror = "2"
icu_normalizer = "=2.2.0"
unicode-segmentation = "=1.13.3"
uuid = { version = "1", features = ["serde", "v4"] }

# The pinned Rust toolchain strips proc-macro dylibs into a LINKEDIT layout
# that macOS 27 rejects. Keep compiler helpers loadable without changing
# release optimization. See rust-lang/rust#157750.
[profile.release]
strip = "none"
