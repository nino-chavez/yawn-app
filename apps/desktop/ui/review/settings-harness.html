<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Yawn Settings — synthetic review</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../settings-window.css" />
  </head>
  <body>
    <!-- Load the shipped markup, not a second copy that can drift. All data
         comes from the synthetic review stub; no app storage is accessed. -->
    <script src="harness.js"></script>
    <script type="module">
      const response = await fetch("../settings.html");
      if (!response.ok) throw new Error("Could not load the Settings surface");
      const page = new DOMParser().parseFromString(await response.text(), "text/html");
      document.body.replaceChildren(page.querySelector("main"));
      await import("../settings.js");
    </script>
  </body>
</html>
